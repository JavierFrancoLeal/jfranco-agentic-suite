name: Publish to npm

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
      - name: Run the suite quality gate
        run: sh tools/check.sh
      - name: Publish the seven @jfranco packages (Trusted Publishing, no token)
        run: |
          for p in jfranco-workflow-master jfranco-input-detector jfranco-decision-router \
                   jfranco-accountability-auditor jfranco-interpreter jfranco-autonomy-grader \
                   jfranco-balance; do
            name="$(node -p "require('./$p/package.json').name")"
            ver="$(node -p "require('./$p/package.json').version")"
            if npm view "$name@$ver" version >/dev/null 2>&1; then
              echo "skip $name@$ver (already published)"
            else
              (cd "$p" && npm publish --provenance --access public)
            fi
            # npm staged publishing (registry, GA 2026) crea un placeholder
            # "0.0.0-stage" en el primer publish de un paquete nuevo; deprecarlo.
            npm deprecate "$name@0.0.0-stage" "Placeholder de npm staged publishing — usa latest." >/dev/null 2>&1 || true
          done
