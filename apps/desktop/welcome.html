<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fanal</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,'Segoe UI',Roboto,sans-serif;background:linear-gradient(135deg,#354ed6,#573bd4 55%,#6842cc);min-height:100vh;color:#fff;display:flex;align-items:center;justify-content:center;padding:24px}
.step{max-width:460px;width:100%;text-align:center;animation:rise .5s ease}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.langbox{width:min(460px,90vw);height:80px;margin:44px auto 0;background:rgba(15,23,42,.38);border:1px solid rgba(255,255,255,.38);border-radius:10px;overflow:hidden;cursor:pointer;position:relative;transition:background .2s;box-shadow:0 10px 30px rgba(15,23,42,.15)}
.langbox:hover{background:rgba(15,23,42,.52)}
.ticks{display:flex;flex-direction:column;will-change:transform}
.tick{height:80px;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:600;color:#fff;opacity:.96}
.overlay{position:fixed;inset:0;background:linear-gradient(160deg,#354ed6,#573bd4 60%,#6842cc);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:60;animation:rise .28s ease}
.overlay .top{position:absolute;top:22px;right:26px}
.overlay .close{background:rgba(15,23,42,.38);border:1px solid rgba(255,255,255,.38);color:#fff;border-radius:999px;width:44px;height:44px;font-size:18px;cursor:pointer}
.orow{width:min(520px,92vw);display:flex;justify-content:space-between;align-items:center;padding:15px 22px;border-radius:14px;font-size:19px;color:#fff;cursor:pointer;transition:background .15s,transform .1s}
.orow:hover{background:rgba(15,23,42,.3)}
.orow:active{transform:scale(.98)}
.orow .sub{font-size:13px;opacity:.92}
.orow *{pointer-events:none}
.orow.center{background:rgba(15,23,42,.48);font-size:23px;font-weight:800;border:1px solid rgba(255,255,255,.48)}
.orow.center .sub{opacity:1}
svg .stroke{stroke-dasharray:100;stroke-dashoffset:100;animation:draw 1.6s cubic-bezier(.4,0,.2,1) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.welcome-medallion{width:144px;height:144px;border-radius:36px;margin:0 auto;background:linear-gradient(155deg,#ffffff 0%,#f3f6ff 100%);border:2px solid #ffffff;box-shadow:0 24px 56px rgba(15,23,42,.30),0 0 0 10px rgba(255,255,255,.16);display:inline-flex;align-items:center;justify-content:center}
.welcome-medallion svg{width:122px;height:122px;display:block}
.fanal-tip{position:fixed;left:0;top:0;z-index:1000010;pointer-events:none;max-width:240px;padding:7px 11px;border-radius:10px;background:rgba(16,24,40,.94);color:#f8fafc;border:1px solid rgba(167,139,250,.45);box-shadow:0 12px 28px rgba(15,23,42,.30);font-size:12px;font-weight:500;line-height:1.38;text-align:left;opacity:0;transform:translateY(3px);transition:opacity .14s ease,transform .14s ease}
.fanal-tip.show{opacity:1;transform:translateY(0)}
@media (hover: none), (pointer: coarse){#fanalTooltip{display:none!important}}
.card{background:rgba(255,255,255,.97);border-radius:24px;box-shadow:0 30px 70px rgba(15,23,42,.35);max-width:540px;width:100%;padding:28px 24px;text-align:center;color:#101828;animation:rise .5s ease}
.card h1{font-size:22px;margin:0 0 4px}
.card .tag{color:#475467;font-size:13px;margin:0 0 18px}
.wlbl{display:block;text-align:left;font-size:12px;font-weight:700;color:#101828;margin:4px 0}
.wgate{background:#f8fafc;border:1px solid #cbd5e1;border-radius:14px;padding:10px 12px;margin-bottom:12px;text-align:left}
.wgate-head{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:700;color:#0f172a;margin-bottom:6px}
.wgate-prog{padding:2px 8px;border-radius:999px;font-size:11px;font-weight:700;background:#fef9c3;color:#854d0e}
.wgate-prog.all-ok{background:#dcfce7;color:#166534}
.wgate-list,.wpw-list{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:4px}
.wgate-item{display:flex;align-items:center;gap:7px;font-size:12px;color:#1e293b}
.wgate-tag{margin-left:auto;font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:999px}
.wgate-tag.ok{background:#dcfce7;color:#166534}
.wgate-tag.req{background:#fef9c3;color:#854d0e}
.wgate-tag.opt{background:#e2e8f0;color:#334155}
.wbox{background:#f8fafc;border:1px solid #e2e8f0;border-radius:14px;padding:10px 12px;margin-bottom:10px;text-align:left}
.wgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media(max-width:500px){.wgrid{grid-template-columns:1fr}}
.wtog{background:#eef2ff;color:#1e3a8a;border:1px solid #c7d2fe;font-size:12px;padding:8px 10px;margin:2px 0 6px}
.wpw-list{background:#f8fafc;border:1px solid #cbd5e1;border-radius:12px;padding:8px 10px;margin-bottom:8px;text-align:left}
.wpw-list.hidden,.wcons-hide{display:none}
.wpw-item{display:flex;align-items:center;gap:6px;font-size:11.5px;color:#334155}
.wpw-item.met{color:#166534;font-weight:700}
.werr{font-size:12px;font-weight:600;color:#b91c1c;margin:2px 0 8px;text-align:left}
input,select{width:100%;border:1px solid #cbd5e1;border-radius:12px;padding:12px 14px;font-size:15px;margin-bottom:10px;font-family:inherit;background:#fff;color:#101828}
input:focus,select:focus{outline:none;border-color:#3b56e6;box-shadow:0 0 0 3px rgba(59,86,230,.18)}
button{width:100%;border:none;border-radius:14px;padding:14px;font-size:16px;font-weight:800;color:#fff;background:linear-gradient(135deg,#3b56e6,#6544e8);cursor:pointer;transition:transform .12s}
button:active{transform:scale(.97)}
button:disabled{opacity:.6;cursor:wait}
.back{background:none;border:none;color:#475467;font-size:13px;cursor:pointer;margin-top:12px;width:auto;padding:6px 12px}
.hint{font-size:12px;color:#475467;margin-top:10px;line-height:1.5}
</style>
</head>
<body>

<!-- STEP 1: language first, like Apple's "Hello" -->
<div class="step" id="step1">
  <div class="welcome-medallion"><svg width="122" height="122" viewBox="6 6 52 52" aria-hidden="true"><defs><linearGradient id="fanalWelcomeGd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4D6BFE"/><stop offset="1" stop-color="#7c5cff"/></linearGradient></defs><path class="stroke" pathLength="100" d="M10 32 C10 22 16 14 32 14 C48 14 54 22 54 32 C54 42 48 50 32 50 C20 50 12.5 45.2 10.5 38.5 C14 42.5 20 41 25.4 34.8 A6.6 6.6 0 0 1 38.6 34.8 C38.6 31.4 36.6 28.2 32 22.5 C27.4 28.2 25.4 31.4 25.4 34.8" fill="none" stroke="url(#fanalWelcomeGd)" stroke-width="5.2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
  <div class="langbox" id="langBox"><div class="ticks" id="ticks"></div></div>
  <div class="overlay hidden" id="overlay" style="display:none">
    <div class="top"><button class="close" id="closeOverlay">✕</button></div>
    <div id="oList" style="width:min(520px,92vw)"></div>
  </div>
</div>

<!-- STEP 2: one compact form, in the chosen language -->
<div class="card hidden" id="step2" style="display:none">
  <h1 id="wTitle">Welcome to Fanal</h1>
  <p class="tag" id="tagline">The AI works. The human watches, decides, reviews.</p>
  <div id="welcomeGatePanel" class="wgate">
    <div class="wgate-head"><span id="wGateTitle">Installation readiness check</span><span id="wGateProg" class="wgate-prog">0 / 4</span></div>
    <ul id="wGateList" class="wgate-list"></ul>
  </div>
  <select id="scale">
    <option value="">— 1. Choose your structure first —</option>
    <option value="AUTONOMOUS_SOLO">🧑‍💻 Solo / Self-employed (1 person)</option>
    <option value="MICRO_SINGLE_OWNER">🏠 Micro-business (2–5 people)</option>
    <option value="SME_CELL">🏢 SME / Team (6+ people)</option>
  </select>
  <div id="sectorWrap" style="display:none">
    <label id="sectorLbl" class="wlbl" for="sector">2. Activity sector</label>
    <select id="sector">
      <option value="solo">💼 Professional services / Practice</option>
      <option value="restaurant">🍽️ Restaurant</option>
      <option value="hotel">🏨 Lodging / Hotel</option>
      <option value="clinic">🏥 Clinic / Practice</option>
      <option value="pharmacy">💊 Pharmacy</option>
      <option value="workshop">🔧 Workshop / Trade</option>
      <option value="realestate">🏠 Real estate</option>
      <option value="school">🎓 School / Training</option>
      <option value="tourisme">🧭 Tourism</option>
      <option value="agroalimentaire">🥐 Agri-food &amp; retail</option>
      <option value="generic">⚡ Other / generic</option>
    </select>
  </div>
  <div class="wbox" id="wConsBox">
    <label id="wConsTitle" class="wlbl" style="margin-top:0">⚖️ Closed Constitution &amp; Loi 25</label>
    <input id="wBizName" placeholder="Legal business or practice name">
    <select id="wTaxRegime">
      <option value="PETIT_FOURNISSEUR_EXEMPT">Small supplier (&lt; $30,000 CAD — TPS/TVQ exempt)</option>
      <option value="INSCRIT_TPS_TVQ">Registered TPS &amp; TVQ (&gt;= $30,000 CAD)</option>
    </select>
    <input id="wNeq" placeholder="Quebec NEQ (10 digits, optional if solo)">
    <div id="wFiscalRow" class="wgrid wcons-hide">
      <input id="wTps" placeholder="TPS (123456789RT0001)">
      <input id="wTvq" placeholder="TVQ (1234567890TQ0001)">
    </div>
    <div class="wgrid">
      <input id="wRprpName" placeholder="Loi 25 RPRP full name">
      <input id="wRprpEmail" type="email" placeholder="rprp@company.ca">
    </div>
    <div class="wgrid">
      <select id="wTone">
        <option value="VOUVOIEMENT_CHALEUREUX">Vouvoiement chaleureux</option>
        <option value="TUTOIEMENT_PROCHE">Tutoiement cordial</option>
        <option value="FORMEL_FIDUCIAIRE">Formel fiduciaire strict</option>
      </select>
      <input id="wFloor" type="number" min="1" value="250" placeholder="Floor ($ CAD)">
    </div>
    <div class="wgrid">
      <select id="wDiscount">
        <option value="LOCKED_0_PCT">0% automatic discount locked</option>
        <option value="TIERED_MAX_5_PCT">Up to 5% on documented grid</option>
        <option value="TIERED_MAX_10_PCT">Up to 10% logged</option>
      </select>
      <input id="wInitials" maxlength="16" placeholder="Initials (e.g. JFL-CPA)">
    </div>
  </div>
  <input id="owner" placeholder="Unique owner username">
  <input id="password" type="password" placeholder="Strong password (min. 12 chars)" minlength="12">
  <input id="passwordConfirm" type="password" placeholder="Confirm password">
  <button type="button" id="toggleWelcomePwReq" class="wtog" aria-expanded="false">Show password requirements</button>
  <ul id="welcomePwReqList" class="wpw-list hidden"></ul>
  <div id="wFormErr" class="werr"></div>
  <input id="key" type="password" placeholder="DeepSeek API key (optional — configure now or later)">
  <select id="model">
    <option value="deepseek-flash">DeepSeek-Flash + Gemini (Closed Dual Brain)</option>
    <option value="deepseek-v4-pro">DeepSeek-V4-Pro + Gemini (Deep Reasoning)</option>
  </select>
  <button id="go">Create my Fanal</button>
  <p class="hint" id="hint">This creates the brain on this computer: your account, your sector, your rules. Nothing leaves the machine.</p>
  <button class="back" id="back">← Change language</button>
</div>
<div id="fanalTooltip" class="fanal-tip" role="tooltip" aria-hidden="true"></div>

const ticksEl=document.getElementById("ticks");

  for(const l of Object.keys(LANGS)){
    const d=document.createElement("div");
    d.className="tick";d.textContent=LANGS[l];
    ticksEl.appendChild(d);

// Seamless loop: requestAnimationFrame + modulo — no keyframe restart, no jump.
const TICK_H=80, N=Object.keys(LANGS).length, CYCLE=20000;
const start0=performance.now();
(function frame(now){
  const t=(now-start0)%CYCLE;
  const y=(t/CYCLE)*N*TICK_H;
  ticksEl.style.transform="translateY(-"+y+"px)";
  requestAnimationFrame(frame);
})(start0);

function syncWelcomeCascade(){
  const s=S[cur]||S.en;
  const sc=document.getElementById("scale");
  const wrap=document.getElementById("sectorWrap");
  const secEl=document.getElementById("sector");
  const lbl=document.getElementById("sectorLbl");
  if(!sc||!secEl||!wrap)return;
  if(!sc.value){
    wrap.style.display="none";
    Array.from(secEl.options).forEach(o=>{if(s.sec[o.value])o.textContent=s.sec[o.value];});
    return;
  }
  wrap.style.display="block";
  if(sc.value==="AUTONOMOUS_SOLO"){
    if(lbl)lbl.textContent=s.profLbl||"2. Profession";
    const prev=String(secEl.value||"").startsWith("prof:")?secEl.value:"prof:AUTRE_AUTONOME";
    secEl.innerHTML=WPROFS.map(p=>'<option value="prof:'+p.key+'">'+(p.labels[cur]||p.labels.en)+'</option>').join("");
    secEl.value=prev;
  }else{
    if(lbl)lbl.textContent=s.secLbl||"2. Sector";
    const prev=String(secEl.value||"").startsWith("prof:")?"restaurant":(secEl.value||"restaurant");
    secEl.innerHTML=WSEC_ORDER.map(id=>'<option value="'+id+'">'+(s.sec[id]||id)+'</option>').join("");
    secEl.value=prev;
  }
}

function collectWelcomePayload(){
  const scaleType=document.getElementById("scale")?document.getElementById("scale").value:"";
  const rawSec=document.getElementById("sector")?document.getElementById("sector").value:"";
  let professionKey="",sector=rawSec;
  if(String(rawSec).startsWith("prof:")){
    professionKey=rawSec.slice(5);
    const p=WPROFS.find(x=>x.key===professionKey);
    sector=(p&&p.sec)||"solo";
  }
  return {
    lang:cur,
    user:(document.getElementById("owner")?document.getElementById("owner").value.trim():""),
    password:(document.getElementById("password")?document.getElementById("password").value:""),
    passwordConfirm:(document.getElementById("passwordConfirm")?document.getElementById("passwordConfirm").value:""),
    scaleType,professionKey,sector:scaleType==="AUTONOMOUS_SOLO"?sector:rawSec,
    hasByokKey:Boolean(document.getElementById("key")&&document.getElementById("key").value.trim()),
    constitution:{
      bizName:document.getElementById("wBizName")?document.getElementById("wBizName").value.trim():"",
      taxRegime:document.getElementById("wTaxRegime")?document.getElementById("wTaxRegime").value:"PETIT_FOURNISSEUR_EXEMPT",
      neq:document.getElementById("wNeq")?document.getElementById("wNeq").value.trim():"",
      tpsNumber:document.getElementById("wTps")?document.getElementById("wTps").value.trim():"",
      tvqNumber:document.getElementById("wTvq")?document.getElementById("wTvq").value.trim():"",
      rprpName:document.getElementById("wRprpName")?document.getElementById("wRprpName").value.trim():"",
      rprpEmail:document.getElementById("wRprpEmail")?document.getElementById("wRprpEmail").value.trim():"",
      toneRegister:document.getElementById("wTone")?document.getElementById("wTone").value:"VOUVOIEMENT_CHALEUREUX",
      pricingFloorCad:Number(document.getElementById("wFloor")?document.getElementById("wFloor").value:0),
      discountPolicy:document.getElementById("wDiscount")?document.getElementById("wDiscount").value:"LOCKED_0_PCT",
      escalationRules:["RED_PROMISE_DEADLINE","RED_REFUND_OVER_FLOOR","RED_LEGAL_MEDICAL_OPINION"],
      signerInitials:document.getElementById("wInitials")?document.getElementById("wInitials").value.trim().toUpperCase():""
    }
  };
}
function refreshWelcomeReadiness(){
  const p=collectWelcomePayload();
  const sv=window.FanalSetupValidator;
  const fRow=document.getElementById("wFiscalRow");
  if(fRow)fRow.classList.toggle("wcons-hide",p.constitution.taxRegime!=="INSCRIT_TPS_TVQ");
  const gt=document.getElementById("wGateTitle");if(gt)gt.textContent=wI18n("setupGateTitle","Installation readiness check");
  const wct=document.getElementById("wConsTitle");if(wct)wct.textContent=wI18n("setupConsTitle","⚖️ Closed Constitution & Loi 25");
  const btnReq=document.getElementById("toggleWelcomePwReq");
  if(btnReq){btnReq.textContent=wPwReqOpen?wI18n("pwReqHideBtn","Hide password requirements"):wI18n("pwReqShowBtn","Show password requirements");btnReq.setAttribute("aria-expanded",wPwReqOpen?"true":"false");}
  const ulPw=document.getElementById("welcomePwReqList");
  if(ulPw)ulPw.classList.toggle("hidden",!wPwReqOpen);
  if(!sv)return null;
  const res=sv.evaluateSetupReadiness(p);
  const gp=document.getElementById("wGateProg");
  if(gp){gp.textContent=res.completedRequiredCount+" / "+res.requiredCount;gp.classList.toggle("all-ok",res.ready);}
  const labels={lang:"setupGateLang",structure:"setupGateStructure",constitution:"setupGateCons",credentials:"setupGateCreds",byok:"setupGateByok"};
  const gl=document.getElementById("wGateList");
  if(gl){
    gl.innerHTML=res.items.map(it=>'<li class="wgate-item">'+(it.done?W_SVG_OK:W_SVG_PEND)+'<span>'+wI18n(labels[it.id],it.id)+'</span><span class="wgate-tag '+(it.done?"ok":(it.optional?"opt":"req"))+'">'+wI18n(it.done?"setupStatusVerified":(it.optional?"setupStatusOptional":"setupStatusRequired"))+'</span></li>').join("");
  }
  if(ulPw){
    ulPw.innerHTML=sv.PASSWORD_RULES_SPEC.rules.map(r=>{
      const met=Boolean(res.passwordAudit&&res.passwordAudit.criteria&&res.passwordAudit.criteria[r.id]);
      return '<li class="wpw-item'+(met?" met":"")+'">'+(met?W_SVG_OK:W_SVG_PEND)+'<span>'+wI18n(r.labelKey,r.id)+'</span></li>';
    }).join("");
  }
  return res;
}

function choose(l){
  cur=l;
  const s=S[l];
  document.documentElement.lang=l;
  document.title=s.docTitle||s.title;
  document.getElementById("wTitle").textContent=s.title;
  document.getElementById("tagline").textContent=TAGS[l];
  document.getElementById("owner").placeholder=wI18n("setupUserPh",s.name);
  document.getElementById("password").placeholder=wI18n("setupPassPh",s.pass);
  document.getElementById("passwordConfirm").placeholder=wI18n("setupPassConfirmPh","Confirm password");
  document.getElementById("wBizName").placeholder=wI18n("consBizNamePh","Legal business name");
  document.getElementById("wNeq").placeholder=wI18n("consNeqPh","Quebec NEQ (10 digits)");
  document.getElementById("wRprpName").placeholder=wI18n("consRprpNamePh","Loi 25 RPRP full name");
  document.getElementById("wRprpEmail").placeholder=wI18n("consRprpEmailPh","rprp@company.ca");
  document.getElementById("wInitials").placeholder=wI18n("consInitialsPh","e.g. JFL-CPA");
  document.getElementById("key").placeholder=s.key;
  const mdl=document.getElementById("model");
  if(mdl&&mdl.options){
    if(mdl.options[0])mdl.options[0].textContent=s.mFast;
    if(mdl.options[1])mdl.options[1].textContent=s.mDeep;
  }
  const sc=document.getElementById("scale");
  if(sc&&sc.options){
    Array.from(sc.options).forEach(o=>{
      if(o.value==="")o.textContent=s.scPrompt;
      else if(o.value==="AUTONOMOUS_SOLO")o.textContent=s.scSolo;
      else if(o.value==="MICRO_SINGLE_OWNER")o.textContent=s.scMicro;
      else if(o.value==="SME_CELL")o.textContent=s.scSme;
    });
  }
  const secEl=document.getElementById("sector");
  if(secEl&&secEl.options&&s.sec){
    Array.from(secEl.options).forEach(o=>{if(s.sec[o.value])o.textContent=s.sec[o.value];});
  }
  syncWelcomeCascade();
  document.getElementById("go").textContent=s.btn;
  document.getElementById("hint").textContent=s.hint;
  document.getElementById("back").textContent=s.back;
  document.getElementById("step1").style.display="none";
  document.getElementById("step2").style.display="block";
  refreshWelcomeReadiness();
}
document.getElementById("back").onclick=()=>{
  document.getElementById("step2").style.display="none";
  document.getElementById("step1").style.display="block";
};
document.getElementById("go").onclick=()=>{
  const p=collectWelcomePayload();
  const sv=window.FanalSetupValidator;
  const errEl=document.getElementById("wFormErr");
  if(errEl)errEl.textContent="";
  if(sv){
    const val=sv.validateSetupPayload(p,{},{});
    if(!val.valid){
      if(!p.password||!val.passwordAudit.valid){wPwReqOpen=true;refreshWelcomeReadiness();}
      if(errEl)errEl.textContent=val.errors.join(" · ");
      return;
    }
  }else if(!p.scaleType||!p.user||p.password.length<12||p.password!==p.passwordConfirm){
    if(errEl)errEl.textContent=wI18n("consNeedValid","Complete all required fields.");
    return;
  }
  const btn=document.getElementById("go");
  btn.disabled=true;btn.textContent="…";
  try{
    if(window.leVeilleux&&window.leVeilleux.setup)window.leVeilleux.setup({user:p.user,password:p.password,passwordConfirm:p.passwordConfirm,sector:p.sector,professionKey:p.professionKey,scaleType:p.scaleType,lang:cur,key:document.getElementById("key").value.trim(),model:document.getElementById("model").value,constitution:p.constitution});
  }catch(e){btn.disabled=false;btn.textContent=S[cur].btn;}
};

(function initWelcomeTooltips(){
  const tip=document.getElementById("fanalTooltip");
  if(!tip||typeof document.addEventListener!=="function")return;
  const canHover=()=>{try{return typeof window.matchMedia==="function"&&window.matchMedia("(hover: hover) and (pointer: fine)").matches;}catch(e){return false;}};
  const isOn=()=>{if(!canHover())return false;try{return localStorage.getItem("fanal-tooltips")!=="0";}catch(e){return true;}};
  let timer=null,active=null;
  const hide=()=>{if(timer){clearTimeout(timer);timer=null;}active=null;tip.classList.remove("show");tip.setAttribute("aria-hidden","true");};
  const getKey=(el)=>{
    if(!el)return "";
    if(el.id==="langBox")return "langBox";
    if(el.id==="closeOverlay")return "closeOverlay";
    if(el.classList&&el.classList.contains("orow"))return "langRow";
    if(el.id==="owner"||el.id==="password"||el.id==="key"||el.id==="model"||el.id==="scale"||el.id==="sector"||el.id==="go"||el.id==="back")return el.id;
    return "";
  };
  const showTip=(el)=>{
    const k=getKey(el);
    const tl=(el.dataset&&el.dataset.tipLang)||cur;
    const m=(k==="langRow"?(WTIP[tl]||WTIP.en):(WTIP[cur]||WTIP.en));
    const txt=(k&&m[k])||"";
    if(!txt){hide();return;}
    tip.dir=tl==="ar"?"rtl":"ltr";
    tip.textContent=txt;tip.setAttribute("aria-hidden","false");
    const r=el.getBoundingClientRect();
    tip.style.left="-9999px";tip.style.top="0px";tip.classList.add("show");
    const tw=tip.offsetWidth||180,th=tip.offsetHeight||32,vw=window.innerWidth||800,vh=window.innerHeight||600;
    const left=Math.max(10,Math.min(vw-tw-10,r.left+r.width/2-tw/2));
    const top=(r.bottom+8+th+10>vh)?Math.max(10,r.top-th-8):r.bottom+8;
    tip.style.left=Math.round(left)+"px";tip.style.top=Math.round(top)+"px";
  };
  document.addEventListener("pointerover",(ev)=>{
    if(!isOn()){hide();return;}
    const el=ev.target&&ev.target.closest?ev.target.closest("#langBox, #closeOverlay, .orow, input, select, button"):null;
    if(!el||active===el)return;
    if(timer)clearTimeout(timer);
    active=el;
    timer=setTimeout(()=>{if(active&&isOn())showTip(active);},280);
  },true);
  document.addEventListener("pointerout",(ev)=>{
    if(!active)return;
    if(ev.target&&ev.relatedTarget&&active.contains&&active.contains(ev.relatedTarget))return;
    hide();
  },true);
  document.addEventListener("pointerdown",hide,true);
  document.addEventListener("input",hide,true);
  document.addEventListener("keydown",(ev)=>{if(ev.key==="Escape")hide();},true);
  window.addEventListener("scroll",hide,true);
  window.addEventListener("blur",hide);
})();
</script>
