<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Le Veilleux — Welcome</title>
<style>
:root{--blue:#4D6BFE;--violet:#7c5cff;--ink:#101828;--muted:#667085}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,'Segoe UI',Roboto,sans-serif;background:linear-gradient(135deg,#4D6BFE,#7c5cff 55%,#a78bfa);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.card{background:rgba(255,255,255,.94);border-radius:24px;box-shadow:0 30px 70px rgba(15,23,42,.35);max-width:440px;width:100%;padding:34px 30px;text-align:center;animation:rise .5s ease}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
svg .stroke{stroke-dasharray:100;stroke-dashoffset:100;animation:draw 1.6s cubic-bezier(.4,0,.2,1) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
h1{font-size:22px;margin:14px 0 2px;color:var(--ink)}
.tag{color:var(--muted);font-size:13px;margin:0 0 14px}
.langs{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin:0 0 18px}
.pill{background:#fff;border:1px solid #e3e6ee;border-radius:999px;padding:6px 11px;font-size:12px;cursor:pointer;color:var(--ink)}
.pill.active{background:var(--blue);color:#fff;border-color:var(--blue)}
input,select{width:100%;border:1px solid #e3e6ee;border-radius:12px;padding:12px 14px;font-size:15px;margin-bottom:10px;font-family:inherit}
input:focus,select:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(77,107,254,.18)}
button{width:100%;border:none;border-radius:14px;padding:14px;font-size:16px;font-weight:800;color:#fff;background:linear-gradient(135deg,#4D6BFE,#7c5cff);cursor:pointer;transition:transform .12s}
button:active{transform:scale(.97)}
button:disabled{opacity:.6;cursor:wait}
.hint{font-size:12px;color:var(--muted);margin-top:10px;line-height:1.5}
</style>
</head>
<body>
<div class="card">
  <svg width="92" height="92" viewBox="0 0 64 64" aria-hidden="true">
    <defs><linearGradient id="wg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4D6BFE"/><stop offset="1" stop-color="#7c5cff"/></linearGradient></defs>
    <path class="stroke" pathLength="100" d="M10 32 C10 22 16 14 32 14 C48 14 54 22 54 32 C54 42 48 50 32 50 C20 50 12.5 45.2 10.5 38.5 C14 42.5 20 41 25.4 34.8 A6.6 6.6 0 0 1 38.6 34.8 C38.6 31.4 36.6 28.2 32 22.5 C27.4 28.2 25.4 31.4 25.4 34.8" fill="none" stroke="url(#wg)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
  <h1>Le Veilleux</h1>
  <p class="tag" id="tagline">The AI works. The human watches, decides, reviews.</p>
  <div class="langs" id="langs"></div>
  <input id="owner" placeholder="Your name (the owner)">
  <input id="password" type="password" placeholder="Password (min. 8 characters)" minlength="8">
  <select id="sector">
    <option value="restaurant">🍽️ Restaurant</option>
    <option value="hotel">🏨 Hotel</option>
    <option value="clinic">🏥 Clinic</option>
    <option value="pharmacy">💊 Pharmacy</option>
    <option value="workshop">🔧 Workshop</option>
    <option value="realestate">🏠 Real estate</option>
    <option value="school">🎓 School</option>
  </select>
  <button id="go">Create my Le Veilleux</button>
  <p class="hint" id="hint">This creates the brain on this computer: your account, your sector, your rules. Nothing leaves the machine.</p>
</div>
<script>
"use strict";
const TAGS={
 en:"The AI works. The human watches, decides, reviews.",
 es:"La IA trabaja. El humano vela, decide, revisa.",
 fr:"L'IA travaille. L'humain veille, décide, revoit.",
 de:"Die KI arbeitet. Der Mensch wacht, entscheidet, prüft.",
 it:"L'IA lavora. L'umano veglia, decide, rivede.",
 pt:"A IA trabalha. O humano vela, decide, revê.",
 zh:"AI 工作，人来守护、决定、复核。",
 ja:"AIが働き、人間が見守り、決め、見直す。",
 ko:"AI가 일하고 사람이 지키고, 결정하고, 검토합니다.",
 ar:"الذكاء الاصطناعي يعمل، والإنسان يراقب ويقرر ويراجع."
};
const NAMES={es:"ES",en:"EN",fr:"FR",de:"DE",it:"IT",pt:"PT",zh:"中文",ja:"日本語",ko:"한국어",ar:"العربية"};
let cur="en";
const langsEl=document.getElementById("langs");
for(const l of Object.keys(TAGS)){
  const b=document.createElement("button");
  b.className="pill"+(l===cur?" active":"");
  b.textContent=NAMES[l];
  b.onclick=()=>{cur=l;document.getElementById("tagline").textContent=TAGS[l];document.querySelectorAll(".pill").forEach(p=>p.classList.remove("active"));b.classList.add("active");};
  langsEl.appendChild(b);
}
document.getElementById("go").onclick=()=>{
  const owner=document.getElementById("owner").value.trim();
  const password=document.getElementById("password").value;
  const sector=document.getElementById("sector").value;
  if(!owner||password.length<8){alert("Enter your name and a password of at least 8 characters.");return;}
  const btn=document.getElementById("go");
  btn.disabled=true;btn.textContent="Creating…";
  try{
    if(window.leVeilleux&&window.leVeilleux.setup)window.leVeilleux.setup({user:owner,password,sector});
    else{location.reload();}
  }catch(e){btn.disabled=false;btn.textContent="Create my Le Veilleux";}
};
</script>
</body>
</html>
