<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Le Veilleux — Bienvenue</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,'Segoe UI',Roboto,sans-serif;background:linear-gradient(135deg,#4D6BFE,#7c5cff 55%,#a78bfa);min-height:100vh;color:#fff;display:flex;align-items:center;justify-content:center;padding:24px}
.step{max-width:460px;width:100%;text-align:center;animation:rise .5s ease}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.langbox{width:min(340px,86vw);height:58px;margin:34px auto 0;background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.30);border-radius:10px;backdrop-filter:blur(8px);overflow:hidden;cursor:pointer;position:relative;transition:background .2s;box-shadow:0 10px 30px rgba(15,23,42,.15)}
.langbox:hover{background:rgba(255,255,255,.18)}
.ticks{display:flex;flex-direction:column;animation:reel 9s linear infinite}
.tick{height:58px;display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:600;opacity:.85}
@keyframes reel{0%{transform:translateY(0)}100%{transform:translateY(-580px)}}
.overlay{position:fixed;inset:0;background:linear-gradient(160deg,#4D6BFE,#7c5cff 60%,#a78bfa);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:60;animation:rise .28s ease}
.overlay .top{position:absolute;top:22px;right:26px}
.overlay .close{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:999px;width:44px;height:44px;font-size:18px;cursor:pointer}
.orow{width:min(520px,92vw);display:flex;justify-content:space-between;align-items:center;padding:15px 22px;border-radius:14px;font-size:19px;color:#fff;cursor:pointer;transition:background .15s,transform .1s}
.orow:hover{background:rgba(255,255,255,.12)}
.orow:active{transform:scale(.98)}
.orow .sub{font-size:13px;opacity:.7}
.orow.center{background:rgba(255,255,255,.30);font-size:23px;font-weight:800;border:1px solid rgba(255,255,255,.45)}
.orow.center .sub{opacity:.9}
svg .stroke{stroke-dasharray:100;stroke-dashoffset:100;animation:draw 1.6s cubic-bezier(.4,0,.2,1) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.card{background:rgba(255,255,255,.95);border-radius:24px;box-shadow:0 30px 70px rgba(15,23,42,.35);max-width:440px;width:100%;padding:34px 30px;text-align:center;color:#101828;animation:rise .5s ease}
.card h1{font-size:22px;margin:0 0 4px}
.card .tag{color:#667085;font-size:13px;margin:0 0 18px}
input,select{width:100%;border:1px solid #e3e6ee;border-radius:12px;padding:12px 14px;font-size:15px;margin-bottom:10px;font-family:inherit}
input:focus,select:focus{outline:none;border-color:#4D6BFE;box-shadow:0 0 0 3px rgba(77,107,254,.18)}
button{width:100%;border:none;border-radius:14px;padding:14px;font-size:16px;font-weight:800;color:#fff;background:linear-gradient(135deg,#4D6BFE,#7c5cff);cursor:pointer;transition:transform .12s}
button:active{transform:scale(.97)}
button:disabled{opacity:.6;cursor:wait}
.back{background:none;border:none;color:#667085;font-size:13px;cursor:pointer;margin-top:12px;width:auto;padding:6px 12px}
.hint{font-size:12px;color:#667085;margin-top:10px;line-height:1.5}
</style>
</head>
<body>

<!-- STEP 1: language first, like Apple's "Hello" -->
<div class="step" id="step1">
  <svg width="120" height="120" viewBox="0 0 64 64" aria-hidden="true"><path class="stroke" pathLength="100" d="M10 32 C10 22 16 14 32 14 C48 14 54 22 54 32 C54 42 48 50 32 50 C20 50 12.5 45.2 10.5 38.5 C14 42.5 20 41 25.4 34.8 A6.6 6.6 0 0 1 38.6 34.8 C38.6 31.4 36.6 28.2 32 22.5 C27.4 28.2 25.4 31.4 25.4 34.8" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg>
  <div class="langbox" id="langBox"><div class="ticks" id="ticks"></div></div>
  <div class="overlay hidden" id="overlay" style="display:none">
    <div class="top"><button class="close" id="closeOverlay">✕</button></div>
    <div id="oList" style="width:min(520px,92vw)"></div>
  </div>
</div>

<!-- STEP 2: one compact form, in the chosen language -->
<div class="card hidden" id="step2" style="display:none">
  <h1 id="wTitle">Welcome to Le Veilleux</h1>
  <p class="tag" id="tagline">The AI works. The human watches, decides, reviews.</p>
  <input id="owner" placeholder="Your name (the owner)">
  <input id="password" type="password" placeholder="Password (min. 8 characters)" minlength="8">
  <select id="sector">
    <option value="restaurant">🍽️ Restaurant</option>
    <option value="hotel">🏨 Hotel</option>
    <option value="clinic">🏥 Clinic</option>
    <option value="pharmacy">💊 Pharmacy</option>
    <option value="workshop">🔧 Workshop</option>
    <option value="realestate">🏠 Real estate</option>
    <option value="school">🎓 School</option>
  </select>
  <button id="go">Create my Le Veilleux</button>
  <p class="hint" id="hint">This creates the brain on this computer: your account, your sector, your rules. Nothing leaves the machine.</p>
  <button class="back" id="back">← Change language</button>
</div>

<script>
"use strict";
const GREET=["Bonjour","Hola","Hello","你好","مرحبا","안녕하세요","こんにちは","Hallo","Ciao","Olá"];
const LANGS={fr:"Français",en:"English",es:"Español",de:"Deutsch",it:"Italiano",pt:"Português",zh:"中文",ja:"日本語",ko:"한국어",ar:"العربية"};
const TAGS={en:"The AI works. The human watches, decides, reviews.",es:"La IA trabaja. El humano vela, decide, revisa.",fr:"L'IA travaille. L'humain veille, décide, revoit.",de:"Die KI arbeitet. Der Mensch wacht, entscheidet, prüft.",it:"L'IA lavora. L'umano veglia, decide, rivede.",pt:"A IA trabalha. O humano vela, decide, revê.",zh:"AI 工作，人来守护、决定、复核。",ja:"AIが働き、人間が見守り、決め、見直す。",ko:"AI가 일하고 사람이 지키고, 결정하고, 검토합니다.",ar:"الذكاء الاصطناعي يعمل، والإنسان يراقب ويقرر ويراجع."};
const S={
en:{title:"Welcome to Le Veilleux",name:"Your name (the owner)",pass:"Password (min. 8 characters)",btn:"Create my Le Veilleux",hint:"This creates the brain on this computer: your account, your sector, your rules. Nothing leaves the machine.",back:"← Change language"},
es:{title:"Bienvenido a Le Veilleux",name:"Tu nombre (el dueño)",pass:"Contraseña (mín. 8 caracteres)",btn:"Crear mi Le Veilleux",hint:"Esto crea el cerebro en esta computadora: tu cuenta, tu sector, tus reglas. Nada sale de la máquina.",back:"← Cambiar idioma"},
fr:{title:"Bienvenue chez Le Veilleux",name:"Votre nom (le propriétaire)",pass:"Mot de passe (min. 8 caractères)",btn:"Créer mon Le Veilleux",hint:"Cela crée le cerveau sur cet ordinateur : votre compte, votre secteur, vos règles. Rien ne quitte la machine.",back:"← Changer de langue"},
de:{title:"Willkommen bei Le Veilleux",name:"Ihr Name (der Inhaber)",pass:"Passwort (min. 8 Zeichen)",btn:"Mein Le Veilleux erstellen",hint:"Das erstellt das Gehirn auf diesem Computer: Ihr Konto, Ihre Branche, Ihre Regeln. Nichts verlässt den Rechner.",back:"← Sprache ändern"},
it:{title:"Benvenuto in Le Veilleux",name:"Il tuo nome (il proprietario)",pass:"Password (min. 8 caratteri)",btn:"Crea il mio Le Veilleux",hint:"Crea il cervello su questo computer: il tuo account, il tuo settore, le tue regole. Nulla esce dalla macchina.",back:"← Cambia lingua"},
pt:{title:"Bem-vindo ao Le Veilleux",name:"O seu nome (o dono)",pass:"Senha (mín. 8 caracteres)",btn:"Criar o meu Le Veilleux",hint:"Isto cria o cérebro neste computador: a sua conta, o seu setor, as suas regras. Nada sai da máquina.",back:"← Mudar idioma"},
zh:{title:"欢迎使用 Le Veilleux",name:"您的姓名（所有者）",pass:"密码（至少8个字符）",btn:"创建我的 Le Veilleux",hint:"这将在此计算机上创建大脑：您的账户、行业和规则。一切都不离开机器。",back:"← 更改语言"},
ja:{title:"Le Veilleux へようこそ",name:"お名前（オーナー）",pass:"パスワード（8文字以上）",btn:"Le Veilleux を作成",hint:"このコンピュータ上に頭脳を作成します：アカウント、セクター、ルール。すべてマシン内に留まります。",back:"← 言語を変更"},
ko:{title:"Le Veilleux에 오신 것을 환영합니다",name:"이름(소유자)",pass:"비밀번호(8자 이상)",btn:"내 Le Veilleux 만들기",hint:"이 컴퓨터에 두뇌를 만듭니다: 계정, 업종, 규칙. 모든 것이 기기 안에 머무릅니다.",back:"← 언어 변경"},
ar:{title:"مرحبًا بك في Le Veilleux",name:"اسمك (المالك)",pass:"كلمة المرور (8 أحرف على الأقل)",btn:"إنشاء Le Veilleux الخاص بي",hint:"هذا ينشئ العقل على هذا الكمبيوتر: حسابك وقطاعك وقواعدك. لا شيء يغادر الجهاز.",back:"← تغيير اللغة"}
};
let cur="en";
// The glass reel: language names passing through, semi-transparent.
const ticksEl=document.getElementById("ticks");
for(const l of Object.keys(LANGS)){
  const d=document.createElement("div");
  d.className="tick";d.textContent=LANGS[l];
  ticksEl.appendChild(d);
}
// Full-screen list, English centered, the rest by software-industry priority
// (GitHub/StackOverflow order): es, fr, de, ja, zh, pt, it, ko, ar
const ORDER=["it","zh","de","es","en","fr","ja","pt","ko","ar"];
const oList=document.getElementById("oList");
for(const l of ORDER){
  const r=document.createElement("div");
  r.className="orow"+(l==="en"?" center":"");
  r.innerHTML='<span>'+LANGS[l]+'</span><span class="sub">'+GREET[Object.keys(LANGS).indexOf(l)]+'</span>';
  r.onclick=()=>choose(l);
  oList.appendChild(r);
}
document.getElementById("langBox").onclick=()=>{
  document.getElementById("overlay").style.display="flex";
  const en=oList.querySelector(".center");
  if(en)en.scrollIntoView({block:"center"});
};
document.getElementById("closeOverlay").onclick=()=>{document.getElementById("overlay").style.display="none";};
function choose(l){
  cur=l;
  const s=S[l];
  document.getElementById("wTitle").textContent=s.title;
  document.getElementById("tagline").textContent=TAGS[l];
  document.getElementById("owner").placeholder=s.name;
  document.getElementById("password").placeholder=s.pass;
  document.getElementById("go").textContent=s.btn;
  document.getElementById("hint").textContent=s.hint;
  document.getElementById("back").textContent=s.back;
  document.getElementById("step1").style.display="none";
  document.getElementById("step2").style.display="block";
}
document.getElementById("back").onclick=()=>{
  document.getElementById("step2").style.display="none";
  document.getElementById("step1").style.display="block";
};
document.getElementById("go").onclick=()=>{
  const owner=document.getElementById("owner").value.trim();
  const password=document.getElementById("password").value;
  const sector=document.getElementById("sector").value;
  if(!owner||password.length<8){alert(S[cur].name+" / "+S[cur].pass);return;}
  const btn=document.getElementById("go");
  btn.disabled=true;btn.textContent="…";
  try{
    if(window.leVeilleux&&window.leVeilleux.setup)window.leVeilleux.setup({user:owner,password,sector,lang:cur});
  }catch(e){btn.disabled=false;btn.textContent=S[cur].btn;}
};
</script>
</body>
</html>
