<style>
:root{--blue:#4D6BFE;--ink:#101828;--muted:#667085;--bg:#f6f7fb;--card:#fff;--line:#e3e6ee;--line2:#eef0f7;--ok:#22c55e;--bad:#ef4444}
body.dark{--ink:#e6ecf7;--muted:#94a3b8;--bg:#0b1220;--card:#141f31;--line:#26334d;--line2:#26334d}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink)}
header{background:linear-gradient(135deg,#4D6BFE,#7c5cff);color:#fff;padding:18px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
header .logo{font-size:30px}
header .ht{flex:1;min-width:180px}
header h1{margin:0;font-size:20px}
header p{margin:3px 0 0;opacity:.85;font-size:12.5px}
.chip{background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:7px 14px;font-size:13.5px;font-weight:600}
main{max-width:580px;margin:0 auto;padding:16px}
.idcard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.idcard .avatar{width:38px;height:38px;border-radius:50%;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px}
.idcard .who{flex:1;min-width:130px}
.idcard .who b{display:block;font-size:15px}
.idcard .who span{font-size:12.5px;color:var(--muted)}
.idcard input{width:110px;border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:13px;background:var(--card);color:var(--ink)}
.idcard.warn{border-color:var(--bad);background:#fff5f5}
.idcard a{color:var(--blue);font-weight:700;font-size:13.5px}
.primary{display:block;width:100%;margin:14px 0;background:var(--ok);border:none;border-radius:22px;padding:28px 16px;font-size:26px;font-weight:800;color:#fff;cursor:pointer;box-shadow:0 4px 14px rgba(34,197,94,.35)}
.primary:active{transform:scale(.98)}
.primary.live{background:var(--bad);box-shadow:0 4px 14px rgba(239,68,68,.35);animation:pulse 1.6s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(239,68,68,.5)}70%{box-shadow:0 0 0 24px rgba(239,68,68,0)}100%{box-shadow:0 0 0 0 rgba(239,68,68,0)}}
.status{text-align:center;font-size:13.5px;color:var(--muted);margin:4px 0}
.prompt{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;min-height:90px;white-space:pre-wrap;font-size:15px;line-height:1.55}
.row{display:flex;gap:10px;margin:12px 0;flex-wrap:wrap}
.row button{flex:1;min-width:130px;border:none;border-radius:12px;padding:12px;font-size:15px;font-weight:600;color:#fff;cursor:pointer}
.copy{background:var(--blue)}
.speak{background:#7c5cff}
.fbcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:16px 0}
.fbcard h3{margin:0 0 10px;font-size:16px}
.sumcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0}
.sumcard h3{margin:0 0 10px;font-size:16px}
.sumcard .person{margin-bottom:10px}
.sumcard .person b{font-size:14.5px}
.sumcard .req{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:10px;background:var(--line2);border:1px solid var(--line);margin:6px 0;font-size:14px}
.sumcard .req span{flex:1}
.tier{font-size:11.5px;font-weight:800;padding:3px 9px;border-radius:999px}
.tier-GREEN{background:#dcfce7;color:#15803d}
.tier-SEMI{background:#fef9c3;color:#a16207}
.tier-YELLOW{background:#fef9c3;color:#a16207}
.tier-RED{background:#fee2e2;color:#b91c1c}
.confirmBtn{border:none;border-radius:10px;padding:7px 12px;font-size:13px;font-weight:700;background:var(--ok);color:#fff;cursor:pointer}
.confirmBtn.done{background:var(--line2);color:var(--muted);cursor:default}
#convInput{width:100%;box-sizing:border-box;border:1px solid var(--line);border-radius:14px;padding:12px;font-size:16px;margin:12px 0 0;font-family:inherit;background:var(--card);color:var(--ink);resize:vertical}
.fbcard select,.fbcard textarea,.fbcard button{width:100%;box-sizing:border-box;border:1px solid var(--line);border-radius:10px;padding:10px;font-size:14px;margin-bottom:8px;font-family:inherit;background:var(--card);color:var(--ink)}
.fbcard textarea{resize:vertical}
.fbcard button{background:var(--blue);color:#fff;font-weight:600;border:none;cursor:pointer}
.note{font-size:13px;color:var(--muted);line-height:1.65}
code{background:var(--line2);border-radius:6px;padding:2px 6px;font-size:13px}
.foot{text-align:center;padding:6px 16px 16px}
.foot .langs{margin:8px 0}
.foot .copyr{font-size:12px;color:var(--muted)}
.langs{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:10px 0}
.pill{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:8px 13px;font-size:13px;cursor:pointer;color:var(--ink)}
.pill.active{background:var(--blue);color:#fff;border-color:var(--blue)}
</style>
</head>
<body>
<header>
  <div class="logo"><svg width="30" height="26" viewBox="0 0 64 64" aria-hidden="true"><path d="M10 32 C10 22 16 14 32 14 C48 14 54 22 54 32 C54 42 48 50 32 50 C20 50 12.5 45.2 10.5 38.5 C14 42.5 20 41 25.4 34.8 A6.6 6.6 0 0 1 38.6 34.8 C38.6 31.4 36.6 28.2 32 22.5 C27.4 28.2 25.4 31.4 25.4 34.8" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
  <div class="ht">
    <h1 id="title">DSH Assistant — Action Panel</h1>
    <p id="subtitle">J.Franco · DeepSeek Harness · Québec 🍁</p>
  </div>
  <button class="chip" id="darkBtn" style="cursor:pointer">🌙</button>
</header>
<main>
  <div class="idcard" id="idCard">
    <div class="avatar" id="avatar">?</div>
    <div class="who">
      <b id="whoName">—</b>
      <span id="whoRole"></span>
    </div>
    <input id="workerInput" placeholder="User">
    <input id="roleInput" placeholder="Role">
  </div>
  <div id="gateCard" class="idcard warn hidden" style="display:none">
    <div class="avatar">🔒</div>
    <div class="who"><b id="gateTitle">Not identified</b><span id="gateHint"></span></div>
    <a href="/dashboard" id="gateLink">Log in on the Dashboard</a>
  </div>

  <button class="primary" id="listenBtn">🎙️ LISTEN / DICTATE</button>
  <div class="status" id="status"></div>

  <textarea id="convInput" rows="4" placeholder="Speak or type what each person said…"></textarea>
  <button class="primary" id="sendPhraseBtn" style="background:var(--blue);box-shadow:0 4px 14px rgba(77,107,254,.35);margin-top:8px">📤 Send phrase</button>

  <div class="sumcard" id="summaryCard" style="display:none">
    <h3 id="summaryTitle">Conversation summary</h3>
    <div id="speakersList"></div>
    <div id="ordersList"></div>
    <p class="note" id="sentNote"></p>
  </div>

  <p class="note" id="note"></p>
  <p class="note" id="legend"></p>

  <div class="fbcard">
    <h3 id="fbTitle">Field Feedback</h3>
    <select id="fbCat">
      <option id="catError" value="error">Error</option>
      <option id="catImprovement" value="improvement">Improvement</option>
      <option id="catIdea" value="idea">Idea</option>
    </select>
    <textarea id="fbText" rows="3" placeholder="What happened? What should improve?"></textarea>
    <button id="fbSend">Send feedback</button>
  </div>
</main>

<footer class="foot">
  <div class="langs" id="langs"></div>
  <div class="copyr">Suite J.Franco · open source (MIT) · autor J.Franco</div>
</footer>

const $=id=>document.getElementById(id);
const langsEl=$("langs"),workerInput=$("workerInput"),roleInput=$("roleInput"),convInput=$("convInput"),sendPhraseBtn=$("sendPhraseBtn"),summaryCard=$("summaryCard"),speakersList=$("speakersList"),ordersList=$("ordersList"),sentNoteEl=$("sentNote"),summaryTitleEl=$("summaryTitle");
let cur="en",darkOn=false,recording=false,armed=false,rec=null,interim="",finalText="";
// Session continuity: the dashboard sends ?user=…&role=…&lang=…
const q=new URLSearchParams(location.search);
try{
  const savedUser=localStorage.getItem("dsh-worker"),savedRole=localStorage.getItem("dsh-role");
  if(q.get("user"))localStorage.setItem("dsh-worker",q.get("user"));
  if(q.get("role"))localStorage.setItem("dsh-role",q.get("role"));
  if(q.get("label"))localStorage.setItem("dsh-role",q.get("label"));
  workerInput.value=q.get("user")||savedUser||"";
  roleInput.value=q.get("label")||q.get("role")||savedRole||"";
  if(q.get("lang")&&S[q.get("lang")]){cur=q.get("lang");localStorage.setItem("dsh-lang",cur);}
  else if(localStorage.getItem("dsh-lang")&&S[localStorage.getItem("dsh-lang")])cur=localStorage.getItem("dsh-lang");
}catch(e){}
workerInput.oninput=()=>{try{localStorage.setItem("dsh-worker",workerInput.value.trim());}catch(e){}updateIdentity();};
roleInput.oninput=()=>{try{localStorage.setItem("dsh-role",roleInput.value.trim());}catch(e){}updateIdentity();};
function identity(){const w=workerInput.value.trim(),r=roleInput.value.trim();return w?("Worker: "+w+(r?" ("+r+")":"")+". "):"";}
function updateIdentity(){
  const w=workerInput.value.trim(),r=roleInput.value.trim();
  $("idCard").style.display=w?"flex":"none";
  $("gateCard").style.display=w?"none":"flex";
  if(w){
    $("whoName").textContent=w;
    $("whoRole").textContent=S[cur].signedIn+(r?" · "+r:"");
    $("avatar").textContent=w.slice(0,1).toUpperCase();
  }
}
function applyLang(){
  const s=S[cur];
  try{localStorage.setItem("dsh-lang",cur);}catch(e){}
  $("title").textContent=s.title;
  $("subtitle").textContent=s.subtitle;
  $("note").textContent=s.note(END[cur]);
  $("legend").textContent=s.legend;
  try{convInput.placeholder=F[cur].sayPh;sendPhraseBtn.textContent=F[cur].sendPhrase;summaryTitleEl.textContent=F[cur].summaryTitle;sentNoteEl.textContent=F[cur].sentNote;}catch(e){}
  if(!recording)$("listenBtn").textContent=s.listen;
  workerInput.placeholder=s.worker;
  roleInput.placeholder=s.role;
  $("gateTitle").textContent=s.notIdentified;
  $("gateHint").textContent=s.gateHint;
  $("gateLink").textContent=s.loginLink;
  $("fbTitle").textContent=s.fbTitle;
  $("fbText").placeholder=s.fbPh;
  $("catError").textContent=s.catError;
  $("catImprovement").textContent=s.catImprovement;
  $("catIdea").textContent=s.catIdea;
  updateIdentity();
  document.querySelectorAll(".pill").forEach(p=>p.classList.toggle("active",p.dataset.l===cur));
}
function pill(l){
  const b=document.createElement("button");
  b.className="pill";b.dataset.l=l;
  b.textContent=l.toUpperCase()+" · "+LANG[l];
  b.onclick=()=>{cur=l;const F={
 es:{sayPh:"Habla o escribe lo que dijo cada persona…",sendPhrase:"📤 Enviar frase",summaryTitle:"Resumen de la conversación",sentNote:"Enviado a cocina y central",processing:"La IA resume…",noSummary:"El resumen aparecerá aquí.",person:"Persona",confirm:"Confirmar ✓",confirmed:"Confirmado ✔",typeHint:"escribe la frase aquí abajo y pulsa Enviar."},
 en:{sayPh:"Speak or type what each person said…",sendPhrase:"📤 Send phrase",summaryTitle:"Conversation summary",sentNote:"Sent to kitchen & central",processing:"The AI is summarizing…",noSummary:"The summary will appear here.",person:"Person",confirm:"Confirm ✓",confirmed:"Confirmed ✔",typeHint:"type the phrase below and press Send."},
 fr:{sayPh:"Parlez ou écrivez ce que chaque personne a dit…",sendPhrase:"📤 Envoyer",summaryTitle:"Résumé de la conversation",sentNote:"Envoyé en cuisine et au central",processing:"L'IA résume…",noSummary:"Le résumé apparaîtra ici.",person:"Personne",confirm:"Confirmer ✓",confirmed:"Confirmé ✔",typeHint:"écrivez la phrase ci-dessous et appuyez sur Envoyer."},
 de:{sayPh:"Sprechen oder tippen Sie, was jede Person gesagt hat…",sendPhrase:"📤 Senden",summaryTitle:"Gesprächsübersicht",sentNote:"An Küche & Zentrale gesendet",processing:"Die KI fasst zusammen…",noSummary:"Die Übersicht erscheint hier.",person:"Person",confirm:"Bestätigen ✓",confirmed:"Bestätigt ✔",typeHint:"tippen Sie die Phrase unten und drücken Sie Senden."},
 it:{sayPh:"Parla o scrivi cosa ha detto ogni persona…",sendPhrase:"📤 Invia",summaryTitle:"Riepilogo della conversazione",sentNote:"Inviato a cucina e centrale",processing:"L'IA riassume…",noSummary:"Il riepilogo apparirà qui.",person:"Persona",confirm:"Conferma ✓",confirmed:"Confermato ✔",typeHint:"scrivi la frase sotto e premi Invia."},
 pt:{sayPh:"Fale ou escreva o que cada pessoa disse…",sendPhrase:"📤 Enviar",summaryTitle:"Resumo da conversa",sentNote:"Enviado à cozinha e central",processing:"A IA resume…",noSummary:"O resumo aparecerá aqui.",person:"Pessoa",confirm:"Confirmar ✓",confirmed:"Confirmado ✔",typeHint:"escreva a frase abaixo e pressione Enviar."},
 zh:{sayPh:"说出或写下每个人说的话…",sendPhrase:"📤 发送",summaryTitle:"对话摘要",sentNote:"已发送到厨房和中心",processing:"AI 正在总结…",noSummary:"摘要将显示在这里。",person:"人",confirm:"确认 ✓",confirmed:"已确认 ✔",typeHint:"在下方输入内容并点击发送。"},
 ja:{sayPh:"各人の発言を話すか入力してください…",sendPhrase:"📤 送信",summaryTitle:"会話の要約",sentNote:"キッチンと本部へ送信済み",processing:"AI が要約中…",noSummary:"要約がここに表示されます。",person:"人",confirm:"確認 ✓",confirmed:"確認済み ✔",typeHint:"下に入力して送信してください。"},
 ko:{sayPh:"각 사람이 한 말을 말하거나 입력하세요…",sendPhrase:"📤 보내기",summaryTitle:"대화 요약",sentNote:"주방과 중앙으로 전송됨",processing:"AI가 요약 중…",noSummary:"요약이 여기에 표시됩니다.",person:"사람",confirm:"확인 ✓",confirmed:"확인됨 ✔",typeHint:"아래에 입력하고 보내기를 누르세요."},
 ar:{sayPh:"تحدث أو اكتب ما قاله كل شخص…",sendPhrase:"📤 إرسال",summaryTitle:"ملخص المحادثة",sentNote:"أُرسل إلى المطبخ والمركز",processing:"الذكاء الاصطناعي يلخص…",noSummary:"سيظهر الملخص هنا.",person:"شخص",confirm:"تأكيد ✓",confirmed:"تم التأكيد ✔",typeHint:"اكتب العبارة بالأسفل واضغط إرسال."}
};
const TIER={GREEN:"🟢",SEMI:"⚑",YELLOW:"🟡",RED:"🔴"};
function ft(k){return F[cur][k]||F.en[k]||k;}
function renderSummary(st){
  summaryCard.style.display="block";
  speakersList.innerHTML="";
  ordersList.innerHTML="";
  (st.speakers||[]).forEach(p=>{
    const box=document.createElement("div");box.className="person";
    const name=document.createElement("b");name.textContent=ft("person")+" — "+(p.name||"?");box.appendChild(name);
    (p.requests||[]).forEach(r=>{
      const row=document.createElement("div");row.className="req";
      const txt=document.createElement("span");txt.textContent=r.text;row.appendChild(txt);
      const pill=document.createElement("span");pill.className="tier tier-"+(r.tier||"GREEN");pill.textContent=TIER[r.tier||"GREEN"]+" "+(r.tier||"GREEN");row.appendChild(pill);
      const conf=document.createElement("button");conf.className="confirmBtn"+(r.status==="confirmed"?" done":"");
      conf.textContent=r.status==="confirmed"?ft("confirmed"):ft("confirm");
      if(r.status!=="confirmed")conf.onclick=async()=>{
        conf.disabled=true;
        await fetch(SUP+"/api/live/confirm",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({requestId:r.id})});
        pollLive();
      };
      row.appendChild(conf);box.appendChild(row);
    });
    speakersList.appendChild(box);
  });
  if((st.orders||[]).length){const o=document.createElement("b");o.textContent=ft("sentNote")+" ("+st.orders.length+")";ordersList.appendChild(o);}
}
applyLang();};
  langsEl.appendChild(b);
}
for(const l of Object.keys(LANG))pill(l);
applyLang();
function applyToggles(){document.body.classList.toggle("dark",darkOn);$("darkBtn").textContent=darkOn?"☀️":"🌙";}
$("darkBtn").onclick=()=>{darkOn=!darkOn;try{localStorage.setItem("dsh-panel-dark",darkOn?"1":"0");}catch(e){}applyToggles();};
try{darkOn=localStorage.getItem("dsh-panel-dark")==="1";}catch(e){}
applyToggles();
// Dictation: continuous + auto-restart while armed (fixes the instant stop).
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
if(!SR){
  $("listenBtn").disabled=true;
  $("listenBtn").textContent=S[cur].nospeech;
}else{
  $("listenBtn").onclick=()=>{
    if(rec){armed=false;try{rec.stop();}catch(e){}return;}
    armed=true;
    startRec();
  };
}
function startRec(){
  try{
    rec=new SR();
    rec.lang=VOICE[cur]||"es-ES";
    rec.continuous=true;
    rec.interimResults=true;
    let finalAcc="";
    finalText="";
    rec.onresult=(e)=>{
      let interimTxt="";
      for(let i=e.resultIndex;i<e.results.length;i++){
        const r=e.results[i];
        if(r.isFinal){finalAcc+=(finalAcc?" ":"")+r[0].transcript;}
        else interimTxt+=r[0].transcript;
      }
      finalText=finalAcc;
      convInput.value=(finalAcc?finalAcc+" ":"")+(interimTxt?interimTxt:"");
      interim=finalAcc;
    };
    rec.onend=()=>{
      recording=false;
      $("listenBtn").classList.remove("live");
      $("status").textContent="";
      rec=null;
      if(armed){setTimeout(startRec,250);} // silence auto-stop → keep listening
      else{$("listenBtn").textContent=S[cur].listen;}
    };
    rec.onerror=(e)=>{
      if(e.error==="not-allowed"){armed=false;$("status").textContent=S[cur].micError+" — "+F[cur].typeHint;}
      else if(e.error==="no-speech"){/* armed keeps restarting */}
      else{armed=false;$("status").textContent=S[cur].micError+" — "+F[cur].typeHint;}
      if(!armed){recording=false;$("listenBtn").classList.remove("live");$("listenBtn").textContent=S[cur].listen;rec=null;}
    };
    recording=true;
    $("listenBtn").classList.add("live");
    $("listenBtn").textContent=S[cur].stop;
    $("status").textContent=S[cur].recording;
    rec.start();
  }catch(e){
    armed=false;recording=false;
    $("status").textContent=S[cur].micError+" — "+F[cur].typeHint;
    $("listenBtn").textContent=S[cur].listen;
  }
}
// ── The real field flow: phrase → transcript → FLASH summary → confirm ──
const SUP=location.origin;
async function pollLive(){
  try{
    const r=await fetch(SUP+"/api/live");
    const st=await r.json();
    if(st&&st.status==="summary")renderSummary(st);
  }catch(e){}
}
sendPhraseBtn.onclick=async()=>{
  const text=convInput.value.trim();
  if(!text){convInput.focus();return;}
  $("status").textContent=ft("processing");
  await fetch(SUP+"/api/live/transcript",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({worker:workerInput.value.trim()||"worker",text})});
  convInput.value="";
  $("status").textContent="";
};
setInterval(pollLive,3000);
pollLive();
// Field feedback: send to the supervisor backend, or copy a prompt for DSH.
$("fbSend").onclick=async()=>{
  const text=$("fbText").value.trim();
  if(!text){$("fbText").focus();return;}
  const w=workerInput.value.trim(),r=roleInput.value.trim();
  let sent=false;
  try{
    const res=await fetch(SUP+"/api/feedback",{
      method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({worker:w||"anonymous",role:r,category:$("fbCat").value,text})
    });
    sent=res.ok;
  }catch(e){}
  if(sent){
    $("fbSend").textContent=S[cur].fbSent;
    $("fbText").value="";
    setTimeout(()=>$("fbSend").textContent=S[cur].fbSent,2500);
  }else{
    const prompt="Feedback ("+$("fbCat").value+")"+(w?" from "+w+(r?" ("+r+")":""):"")+": "+text;
    try{await navigator.clipboard.writeText(prompt);}catch(e){}
    $("fbSend").textContent=S[cur].fbOffline;
    $("fbText").value="";
    setTimeout(()=>$("fbSend").textContent=S[cur].fbSent,3000);
  }
};
if("serviceWorker" in navigator && /^https?:$/.test(location.protocol)){
  navigator.serviceWorker.register("sw.js").catch(()=>{});
}
